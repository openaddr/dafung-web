[package]
name = "app"
# 仅满足 Cargo 清单强制字段;应用版本唯一源是根 package.json(tauri.conf.json 路径引用它,此处被遮蔽)
version = "0.1.0"
description = "群雄逐鹿 — 三国大富翁打包壳"
authors = ["ning"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
