      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;

        font: 16px/1.5 var(--font-wenkai);
      }
      .prototype {
        width: min(100% - 24px, 878px);
        margin: 25px auto;
      }
      h1, h2, p { margin: 0; font-weight: normal; }
      h1, h2 { font-family: var(--font-title); }
      h1 { font-size: 30px; letter-spacing: 0.08em; }
      .intro { margin: 5px 0 16px; color: var(--color-paper-dim); }
      .controls, .variants, .groups, .scenes {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 7px;
      }
      .controls { margin-bottom: 10px; justify-content: space-between; }
      button {
        font: 16px/1.15 var(--font-brush);
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible { outline: 2px solid var(--color-gold-bright); outline-offset: 3px; }
      .controls button, .variants button {
        min-height: 44px;
        padding: 0 11px;
        border: 1px solid #625439;
        border-radius: 5px;
        background: var(--color-panel);
      }
      button[aria-pressed="true"] {
        border-color: var(--color-gold);
        background: var(--color-panel-hi);
        color: var(--color-gold-bright);
      }
      .stage-wrap {
        width: 100%;
        max-width: 844px;
        aspect-ratio: 844 / 390;
        margin: auto;
        outline: 1px solid #625439;
        background: var(--color-bg);
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 844px;
        height: 390px;
        isolation: isolate;
        transform-origin: top left;
        overflow: hidden;
        background: var(--color-bg) url(art/guanzhong.webp) center / 844px 390px no-repeat;
      }
      .stage.home { background-image: url(art/home.webp); }
      .variants { justify-content: center; margin: 12px 0; }
      .variants button { min-width: 88px; }
      .view-help {
        min-height: 24px;
        text-align: center;
        font-size: 14px;
        color: var(--color-paper-dim);
      }
      a { color: var(--color-gold-bright); }
      .hintbar {
        position: absolute;
        left: 184px;
        top: 6px;
        width: 372px;
        padding: 8px 14px;
        border-radius: 5px;
        border: 1px solid #82714d;
        background: linear-gradient(180deg, var(--color-paper-hi), var(--color-paper-lo));
        text-align: center;
        color: var(--color-paper);
      }
      .rack {
        position: absolute;
        left: 0;
        bottom: 14px;
        width: 738px;
        display: flex;
        gap: 19px;
        justify-content: center;
        align-items: flex-end;
      }
      .face-btn, .rack .face-btn, .manual-grid .face-btn {
        padding: 0;
        border: 0;
        border-radius: 6px;
        color: inherit;
        background: transparent;
      }
      .face-btn { display: block; flex: 0 0 auto; }
      .rack .face-btn { position: relative; }
      .rack .selected-btn { z-index: 2; }
      .rack .selected-btn .card {
        outline: 2px solid var(--color-gold);
        outline-offset: 2px;
        box-shadow: 0 0 18px #ad8a47aa, 0 7px 18px #0009;
        transform: translateY(-9px) scale(1.6);
        transform-origin: bottom center;
      }
      .rack .selected-btn .foot { -webkit-line-clamp: 4; max-height: 6.48em; }
      .rack .selected-btn .card-title { min-height: 2.4em; }
      .rack .selected-btn .picture { min-height: 3.5em; margin: 0.45em 0; }
      .card {
        --card-paper: #ece1c6;
        --card-paper-deep: #e3d4b2;
        --card-xin: #f2e8d2;
        --card-ink: #2f2718;
        position: relative;
        isolation: isolate;
        display: flex;
        flex-direction: column;
        flex: 0 0 auto;
        width: 15em;
        height: 20em;
        padding: 1em;
        overflow: hidden;
        border: 0.2em solid #bfa567;
        border-radius: 0.9em;
        background: linear-gradient(168deg, var(--card-paper), var(--card-paper-deep));
        box-shadow: 0 0.35em 0.8em #0007, inset 0 0 0 0.15em #2f27182a;
        color: var(--card-ink);
        font: 8px/1.62 var(--font-wenkai);
        text-align: left;
      }
      .card.small { font-size: 6.4px; }
      .f-mou { --fam: var(--color-seal-qing); }
      .f-gong { --fam: var(--color-danger); }
      .f-yuan { --fam: var(--color-money); }
      .f-shi { --fam: var(--color-jishi); }
      .card-title {
        display: flex;
        align-items: stretch;
        gap: 0.7em;
        min-height: 3.4em;
        margin-right: 3.8em;
        flex: 0 0 auto;
      }
      .card-ruling { width: 0.32em; opacity: 0.85; background: var(--fam); border-radius: 0.16em; }
      .card-name {
        align-self: center;
        font: 2em/1.15 var(--font-title);
        white-space: nowrap;
        letter-spacing: 0.06em;
      }
      .card-name.long { font-size: 1.72em; letter-spacing: 0.04em; }
      .stamps { position: absolute; top: 0.9em; right: 0.9em; z-index: 1; }
      .stamps.double { top: 0.6em; }
      .stamp {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.3em;
        height: 2.3em;
        border-radius: 0.28em;
        background: #944432;
        color: var(--color-paper);
        font: 1.5em/1 var(--font-title);
        transform: rotate(2.5deg);
        box-shadow: 0 0.15em 0.3em #0004;
      }
      .stamp.reaction { font-size: 1.22em; width: 2.82em; height: 2.82em; }
      .stamps .stamp + .stamp { font-size: 1.22em; margin: -0.9em 0 0 0.63em; transform: rotate(-4deg); }
      .picture {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1 1 auto;
        min-height: 4.5em;
        margin: 0.9em 0;
        border: 0.16em solid #bda66a;
        border-radius: 0.5em;
        overflow: hidden;
        background: var(--card-xin, #f2e8d2);
      }
      .picture img, .picture svg { position: absolute; }
      .picture img { inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .picture svg {
        left: 2%; top: 2%; width: 96%; height: 96%;
        opacity: 0.85;
        stroke: var(--fam);
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .foot {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        height: 3.24em;
        max-height: 3.24em;
        overflow: hidden;
        font-size: 1.32em;
        flex: 0 0 auto;
      }
      .small .foot { font-size: 1.5em; }
      .rack .selected-btn .foot { height: auto; min-height: 3.24em; }
      .copies {
        position: absolute;
        right: 0.45em;
        bottom: 0.35em;
        padding: 0 0.35em;
        border: 1px solid #2f271824;
        border-radius: 0.25em;
        background: var(--card-paper);
        color: #776a50;
        font-size: 1.32em;
        line-height: 1.4;
      }
      .blind .card-name, .blind .foot, .blind .copies, .blind .stamps, .blind .card-ruling,
      .blind .detail-copy { visibility: hidden; }
      .shade {
        position: absolute;
        inset: 0;
        background: #0009;
      }
      .manual-shell {
        position: absolute;
        inset: 44px 25px 20px;
        display: flex;
        flex-direction: column;
        padding: 12px 20px 0;
        border: 1px solid #8d7953;
        border-radius: 8px;
        background: linear-gradient(180deg, var(--color-paper-hi), var(--color-paper-lo));
        box-shadow: 0 12px 24px #0009;

        background: #944432;
        font-size: 13px;
        vertical-align: middle;
      }
      .manual-tabs {
        display: flex;
        gap: 8px;
        flex: 0 0 auto;
        padding: 9px 0 12px;
      }
      .manual-tab {
        padding: 3px 14px;
        border: 1px solid #66583c;
        border-radius: 3px;
        color: var(--color-paper-dim);
        font: 15px/1.1 var(--font-brush);
      }
      .manual-tab.active { border-color: var(--color-gold); color: var(--color-gold-bright); }
      .manual-grid {
        display: flex;
        justify-content: center;
        align-content: flex-start;
        flex-wrap: wrap;
        gap: 12px;
        padding: 2px 0 11px;
        overflow: auto;
      }
      .detail-shell {
        position: absolute;
        left: 94px;
        right: 94px;
        width: 656px;
        padding: 0;
        margin: 0;
        color: var(--color-paper);
        top: 61px;

        align-items: center;
        justify-content: center;
        gap: 24px;
        border: 1px solid #8d7953;
        border-radius: 8px;

        box-shadow: 0 12px 24px #000b;
      }
      .detail-shell .close {
        position: absolute;
        right: 6px;
        top: 6px;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;

        border: 0;
        border-radius: 50%;
        background: transparent;

      }
      .detail-copy h2 { margin-bottom: 7px; font-size: 25px; line-height: 1.2; }

      @media (max-width: 620px) {
        .prototype { width: calc(100% - 16px); margin-top: 12px; }
        .controls { justify-content: flex-start; }
      }

    </script>
    <script>
      const catalog = JSON.parse(document.querySelector("#catalog-data").textContent);
      const motifs = {
        连环计: "duel",
        缓兵之计: "delay",
        窃玉偷香: "jade",
        火烧连营: "fire",
        识破诡计: "counter",
        半路杀出: "ambush",
      };
      const groups = [
        ["连环计", "缓兵之计", "军情密探"],
        ["窃玉偷香", "火烧连营", "横征暴敛"],
        ["识破诡计", "半路杀出", "求贤令"],
      ];

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll('"', "&quot;");
      }

      function picture(id, variant, large = false) {
        const card = catalog[id];
        const raster = variant !== "current" && Object.hasOwn(motifs, id);
        const art = raster
          ? '<img src="art/' + variant + "-" + motifs[id] + '.webp" alt="">'
          : '<svg viewBox="0 0 100 70" aria-hidden="true">' + card.ink + "</svg>";
        return (
          '<div class="picture ' +
          card.family +
          (large ? " detail-picture" : "") +
          '">' +
          art +
          "</div>"
        );
      }

      function stamps(tags) {
        return tags
          .map(
            (tag) =>
              '<span class="stamp' + (tag === "即时" ? " reaction" : "") + '">' + tag + "</span>",
          )
          .join("");
      }

      function face(id, variant, small, copies) {
        const card = catalog[id];
        return (
          '<div class="card ' +
          card.family +
          (small ? " small" : "") +
          '">' +
          '<div class="card-title"><span class="card-ruling"></span><span class="card-name' +
          (id.length > 3 ? " long" : "") +
          '">' +
          id +
          "</span></div>" +
          '<div class="stamps' +
          (card.tags.length > 1 ? " double" : "") +
          '">' +
          stamps(card.tags) +
          "</div>" +
          picture(id, variant) +
          '<div class="foot">' +
          escapeHtml(card.foot) +
          "</div>" +
          (copies ? '<span class="copies">×' + card.copies + "</span>" : "") +
          "</div>"
        );
      }

      function cardButton(id, index, state, manual = false) {
        const active = !manual && state.focus === id;
        const label = state.blind ? "画心 " + (index + 1) : id;
        return (
          '<button type="button" class="face-btn' +
          (active ? " selected-btn" : "") +
          '" data-card="' +
          id +
          '" aria-label="' +
          label +
          '"' +
          (manual ? ' aria-haspopup="dialog"' : ' aria-pressed="' + active + '"') +
          ">" +
          face(id, state.variant, !manual, manual) +
          "</button>"
        );
      }

      function hand(state) {
        const [first, second, reference] = groups[state.group];
        const ids = state.swap ? [second, first, reference] : [first, second, reference];
        return (
          '<div class="hintbar">画心比选 · 架上／放大</div><div class="rack" aria-label="锦囊手牌架">' +
          ids.map((id, index) => cardButton(id, index, state)).join("") +
          "</div>"
        );
      }

      function manual(state) {
        const ids = Object.keys(catalog);
        if (state.swap) ids.reverse();
        return (
          '<div class="shade"></div><section class="manual-shell" aria-label="手册锦囊"' +
          (state.focus ? " inert" : "") +
          ">" +
          '<h2 class="manual-head">手册<span>册</span></h2>' +
          '<div class="manual-tabs" aria-hidden="true">' +
          ["名将", "技能", "锦囊", "珍宝", "机遇"]
            .map(
              (tab) =>
                '<span class="manual-tab' +
                (tab === "锦囊" ? " active" : "") +
                '">' +
                tab +
                "</span>",
            )
            .join("") +
          '</div><div class="manual-grid">' +
          ids.map((id, index) => cardButton(id, index, state, true)).join("") +
          "</div></section>"
        );
      }

      function detail(state) {
        const card = catalog[state.focus];
        const reaction = card.tags.includes("即时");
        return (
          '<div class="shade"></div><dialog open class="detail-shell" aria-label="' +
          (state.blind ? "画心详情" : card.id + "详情") +
          '">' +
          '<button type="button" class="close" data-close aria-label="关闭详情"><span>×</span></button>' +
          (state.variant === "current" && !state.blind
            ? ""
            : picture(card.id, state.variant, true)) +
          '<div class="detail-copy"><h2>' +
          card.id +
          '</h2><div class="detail-meta">' +
          stamps(card.tags) +
          "<span>" +
          card.target +
          " · 牌库 " +
          card.copies +
          " 张</span></div><p>" +
          escapeHtml(card.text) +
          "</p><hr><small>" +
          (reaction
            ? "「即时」为反应标签"
            : "每回合每类限用一张 · " + card.tags.map((tag) => "「" + tag + "」").join("")) +
          "</small></div></dialog>"
        );
      }

      function frame(state) {
        const inManual = state.scene === "manual";
        return (
          (inManual ? manual(state) : hand(state)) + (inManual && state.focus ? detail(state) : "")
        );
      }

      const stage = document.querySelector("#stage");
      const url = new URL(location.href);
      const options = url.protocol === "file:" && url.hash ? url.hash.slice(1) : url.search;
      const params = new URLSearchParams(options);
      const variant = params.get("variant");
      const group = ["0", "1", "2"].indexOf(params.get("group"));
      const state = {
        variant: ["current", "a", "b"].includes(variant) ? variant : "current",
        scene: params.get("scene") === "manual" ? "manual" : "hand",
        group: group === -1 ? 1 : group,
        blind: params.get("blind") === "1",
        swap: params.get("swap") === "1",
        focus: null,
      };

      function draw() {
        const oldGrid = stage.querySelector(".manual-grid");
        const scroll = oldGrid ? oldGrid.scrollTop : 0;
        stage.classList.toggle("blind", state.blind);
        stage.classList.toggle("home", state.scene === "manual");
        stage.innerHTML = frame(state);
        const grid = stage.querySelector(".manual-grid");
        if (grid) grid.scrollTop = scroll;
        document
          .querySelectorAll("[data-variant], [data-scene], [data-group]")
          .forEach((button) => {
            const [key, value] = Object.entries(button.dataset)[0];
            button.setAttribute("aria-pressed", String(state[key]) === value);
          });
        document.querySelector(".groups").hidden = state.scene !== "hand";
        document.querySelector("[data-blind]").setAttribute("aria-pressed", state.blind);
        document.querySelector("[data-shuffle]").hidden = !state.blind;
        document.querySelector("#view-help").textContent =
          state.scene === "hand"
            ? "点牌看 1.6 倍放大，再点收起。"
            : "点任一张看详情，向下滑可看其余锦囊。";
      }

      function writeView() {
        const view = new URLSearchParams({
          variant: state.variant,
          scene: state.scene,
          group: state.group,
          blind: state.blind ? "1" : "0",
          swap: state.swap ? "1" : "0",
        });
        // file:// pages can rewrite their fragment while preserving direct double-click use.
        if (url.protocol === "file:") url.hash = view;
        else url.search = view;
        history.replaceState(null, "", url);
      }

      function closeDetail() {
        const previous = state.focus;
        state.focus = null;
        draw();
        stage.querySelector('[data-card="' + previous + '"]').focus({ preventScroll: true });
      }

      document.querySelector("main").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        const dataset = button.dataset;
        if (button.hasAttribute("data-close")) {
          closeDetail();
          return;
        }
        if (dataset.card) {
          state.focus = state.focus === dataset.card ? null : dataset.card;
          draw();
          const focus =
            state.scene === "manual"
              ? stage.querySelector("[data-close]")
              : stage.querySelector('[data-card="' + dataset.card + '"]');
          focus.focus({ preventScroll: true });
          return;
        }
        if (button.hasAttribute("data-blind")) {
          state.blind = !state.blind;
        } else if (button.hasAttribute("data-shuffle")) {
          state.swap = !state.swap;
        } else if (dataset.group !== undefined) {
          state.group = Number(dataset.group);
          state.focus = null;
        } else if (dataset.scene) {
          state.scene = dataset.scene;
          state.focus = null;
        } else if (dataset.variant) {
          state.variant = dataset.variant;
        }
        writeView();
        draw();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.scene === "manual" && state.focus) closeDetail();
      });

      function scaleStage() {
        stage.style.transform = "scale(" + stage.parentElement.clientWidth / 844 + ")";
      }
      new ResizeObserver(scaleStage).observe(stage.parentElement);
      scaleStage();
      draw();
    </script>
  </body>
