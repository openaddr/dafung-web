<style id="design">
* { box-sizing: border-box; }
:root {
  color-scheme: dark;
  --border: rgba(217, 185, 92, .36);
  --hair: rgba(217, 185, 92, .2);
  --title: "ZCOOL KuHei", "WenQuanYi Zen Hei", "Microsoft YaHei", sans-serif;
  --reading: "LXGW WenKai", "WenQuanYi Zen Hei", "Microsoft YaHei", sans-serif;
}
body { margin: 0; background: var(--color-bg-deep); color: var(--color-paper); font: 15px/1.5 var(--reading); }
button { color: inherit; font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--color-gold-bright); outline-offset: 3px; }
h1, h2, h3, p, figure { margin: 0; }
h1, h2 { font-family: var(--title); font-weight: normal; }
[hidden] { display: none !important; }
.showcase { width: min(100% - 24px, 900px); margin: 0 auto; padding: 22px 0 92px; }
.intro { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.intro h1 { color: var(--color-gold-bright); font-size: 26px; }
.intro small, #guidance { color: var(--color-paper-dim); }
.controls { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 8px; }
.controls button, .switcher button {
  min-width: 44px; min-height: 44px; padding: 4px 13px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--color-panel); white-space: nowrap;
}
.controls button[aria-pressed="true"], .switcher button[aria-pressed="true"] {
  color: var(--color-gold-bright); background: var(--color-lacquer); border-color: var(--color-gold);
}
#scenarios { margin-bottom: 10px; }
.viewport {
  width: min(100%, 844px); margin: 0 auto; position: relative; overflow: hidden;
  aspect-ratio: 844 / 390; background: var(--color-bg); box-shadow: 0 0 0 1px var(--border);
}
#preview { transform-origin: left top; }
#guidance { margin: 10px auto 0; width: min(100%, 844px); }
.switcher {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
  padding: 5px; border: 1px solid var(--border); border-radius: 8px;
  display: flex; gap: 5px; max-width: calc(100vw - 10px);
  background: var(--color-bg-deep); box-shadow: 0 5px 25px rgba(0, 0, 0, .55);
}
.switcher button { padding-inline: 9px; font-size: 13px; }
.scene {
  position: relative; width: 844px; height: 390px; overflow: hidden;
  background: var(--color-bg) url("art/board.webp") center / 844px 390px no-repeat;
  color: var(--color-paper); font: 15px/1.55 var(--reading);
}
.scrim { position: absolute; inset: 0; background: rgba(22, 17, 12, .55); }
.manual-scene { background-image: url("art/home.webp"); }
.manual-scrim { background: rgba(22, 17, 12, .61); }
.manual, .detail-card, .scroll {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  border: 1px solid var(--border); border-radius: 7px;
  background: linear-gradient(180deg, var(--color-lacquer), var(--color-bg));
  box-shadow: inset 0 0 0 1px var(--hair), 0 12px 36px rgba(0, 0, 0, .5);
}
.manual { width: 820px; padding: 17px 15px 20px; }
.manual-head { display: flex; align-items: center; height: 53px; padding: 0 5px; border-bottom: 1px solid var(--hair); }
.manual-head h2 { color: var(--color-gold-bright); font-size: 24px; }
.manual-head .current-tab {
  margin-left: 14px; padding-left: 14px;
  color: var(--color-paper-dim); font-size: 17px;
}
.groups { display: flex; justify-content: space-between; align-items: flex-start; }
.group { flex: none; }
.group h3 { display: flex; align-items: center; gap: 7px; margin: 12px 0 8px; font-size: 15px; font-weight: normal; }
.tier-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tier); }
.good { --tier: var(--color-money); --seal: var(--color-money); }
.neutral { --tier: var(--color-seal-qing); --seal: var(--color-seal-qing); }
.bad { --tier: var(--color-danger); --seal: var(--color-danger); }
.deck { display: flex; gap: 6px; }
.encounter-card {
  position: relative; display: block; width: 93px; height: 124px; padding: 5px 5px 6px; text-align: left;
  overflow: hidden; border: 1px solid var(--border); border-radius: 4px;
  background: linear-gradient(150deg, var(--color-panel-hi), var(--color-bg-deep)); box-shadow: inset 0 0 0 1px var(--hair);
}
.encounter-card:hover, .encounter-card:focus-visible { border-color: var(--color-gold); }
.card-title {
  display: flex; align-items: center; justify-content: space-between; gap: 3px; height: 23px;
  font: 13px/1 var(--title); white-space: nowrap;
}
.stamp {
  display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex: 0 0 auto;
  border-radius: 2px; background: var(--seal); color: var(--color-bg-deep); font: 12px/1 var(--title);
}
.art { display: block; min-width: 0; overflow: hidden; border: 1px solid var(--border); background: var(--color-panel); }
.art img { display: block; object-fit: cover; width: 100%; height: 100%; }
.encounter-card .art { height: 62px; }
.snippet {
  display: block; margin: 4px 1px 0; font-size: 10px; line-height: 1.34; color: var(--color-paper-dim);
  overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; max-height: 2.68em;
}
.detail-dialog {
  margin: 0; padding: 0; border: 0; width: 100vw; max-width: none; height: 100vh; max-height: none;
  background: rgba(22, 17, 12, .66); color: var(--color-paper); overflow: hidden;
}
.detail-dialog::backdrop { background: transparent; }
.detail-card { width: min(650px, calc(100vw - 20px)); padding: 14px; }
.detail-head { display: flex; align-items: center; gap: 8px; min-height: 44px; margin-bottom: 9px; padding: 0 2px; }
.detail-head h2 { color: var(--color-gold-bright); font-size: 23px; }
.detail-head small { margin-left: 4px; color: var(--color-paper-dim); font-size: 13px; }
.detail-head .stamp { width: 22px; height: 22px; font-size: 14px; }
.detail-head .close {
  margin-left: auto; min-width: 42px; min-height: 42px; background: transparent;
  color: var(--color-paper-dim); border: 0; font: 24px/1 sans-serif;
}
.detail-body { display: flex; align-items: flex-start; gap: 14px; padding: 10px; border: 1px solid var(--hair); background: var(--color-bg-deep); }
.detail-body .art { flex: none; width: 217px; height: 163px; }
.detail-text { flex: 1; min-width: 0; }
.story { line-height: 1.67; overflow-wrap: break-word; }
.detail-body .story { margin: 3px 0 9px; }
.read-only, .immediate { border-top: 1px solid var(--hair); }
.read-only p, .immediate { padding: 5px 0; color: var(--color-paper-dim); font-size: 14px; }
.read-only p + p { border-top: 1px dashed var(--hair); }
.effects { color: var(--color-paper); }
.scroll { width: 608px; padding: 10px 12px 12px; }
.scroll.wide { width: 675px; }
.scroll-head {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 9px; height: 43px;
  margin-bottom: 7px;
}
.scroll-head h2 { border-left: 4px solid var(--tier); padding-left: 8px; color: var(--color-paper); font-size: 24px; line-height: 1.17; }
.scroll-head .stamp { width: 26px; height: 26px; font-size: 16px; }
.scroll.good { --tier: var(--color-gold-bright); --seal: var(--color-gold-bright); }
.wheat {
  position: absolute; left: 9px; right: 9px; top: 10px; display: flex; align-items: center;
  justify-content: space-between; opacity: .92; pointer-events: none;
}
.wheat svg.-scale-x-100 { transform: scaleX(-1); }
.scroll-body { display: flex; gap: 13px; padding: 13px; border: 1px solid var(--hair); border-radius: 4px; background: var(--color-bg-deep); }
.scroll-body .art { flex: 0 0 201px; align-self: flex-start; height: 151px; }
.scroll-copy { flex: 1; min-width: 0; }
.scroll .story { margin: 0 0 10px; color: var(--color-paper-dim); }
.scroll.plain .story { text-align: center; }
.options { display: flex; flex-direction: column; gap: 7px; }
.option {
  min-height: 44px; width: 100%; padding: 5px 9px; border: 1px solid var(--border); border-radius: 4px;
  color: var(--color-paper); background: var(--color-panel-hi); font-size: 15px; line-height: 1.48;
}
.option.primary { color: var(--color-gold-bright); background: var(--color-lacquer); border-color: var(--color-gold-wash); }
.option:active { border-color: var(--color-gold-bright); }
.option[disabled] { opacity: .5; cursor: default; }
.test-result {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
  width: max-content; max-width: 85%; text-align: center; padding: 12px 22px; border: 1px solid var(--border);
  border-radius: 5px; background: var(--color-bg-deep);
}
@media (max-width: 560px) {
  .detail-card { max-height: calc(100dvh - 24px); overflow: auto; }
  .detail-body { display: block; }
  .detail-body .art { width: min(100%, 217px); margin-bottom: 8px; }
}
.test-result strong { display: block; color: var(--color-gold-bright); font-weight: normal; margin-bottom: 3px; }
</style>
</head>
<body>
<main class="showcase">
  <header class="intro"><h1>机遇画心</h1><small>设计原型 · 844×390</small></header>
  <nav id="surfaces" class="controls" aria-label="查看位置">
    <button type="button" data-surface="manual">手册机遇笺</button>
    <button type="button" data-surface="scroll">局内抉择</button>
  </nav>
  <nav class="controls" id="scenarios" aria-label="局内样本" hidden></nav>
  <div class="viewport"><div id="preview"></div></div>
  <p id="guidance">点一张机遇笺，查看完整故事和效果。</p>
  <noscript>请启用 JavaScript 来切换原型。<a href="compare.png">查看静态对照</a></noscript>
</main>
<dialog class="detail-dialog" id="detail" aria-label="机遇详情"></dialog>
<nav class="switcher" aria-label="切换方案">
  <button type="button" data-variant="a">A · 抉择都见画心</button>
  <button type="button" data-variant="b">B · 画心留给奇遇宽卷</button>
</nav>
<script id="renderer">
const tierClass = { 好运: 'good', 中性: 'neutral', 霉运: 'bad' };
const esc = (text) => String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
const typeset = (text) => esc(text.replace(/, */g, '，').replace(/; */g, '；').replaceAll('(', '（').replaceAll(')', '）'));
const pill = (label) => `<span class="stamp" aria-hidden="true">${esc(label)}</span>`;

function painting(entry) {
  return `<span class="art"><img src="art/${entry.art}.webp" alt="${esc(entry.subject)}"></span>`;
}

function encounterCard(entry) {
  return `<button class="encounter-card" type="button" data-detail="${entry.art}" aria-label="查看${esc(entry.id)}">
    <span class="card-title"><span>${esc(entry.id)}</span>${pill(entry.tier[0])}</span>
    ${painting(entry)}
    <span class="snippet">${typeset(entry.text)}</span>
  </button>`;
}

function manualContents() {
  const groups = Object.entries(tierClass).map(([tier, cssClass]) => {
    const cards = catalog.filter(entry => entry.tier === tier).map(encounterCard).join('');
    return `<section class="group ${cssClass}">
      <h3><span class="tier-dot" aria-hidden="true"></span>${esc(tier)}</h3><div class="deck">${cards}</div>
    </section>`;
  }).join('');
  return `<div class="scrim manual-scrim"></div><section class="manual" aria-labelledby="manual-title">
    <header class="manual-head"><h2 id="manual-title">手册</h2><span class="current-tab">机遇笺</span></header>
    <div class="groups">${groups}</div>
  </section>`;
}

function instantEffect(effect) {
  switch (effect.kind) {
    case 'cash': {
      const parts = [];
      if (effect.delta) parts.push(`银两 +${effect.delta} 两`);
      if (effect.staminaDelta) parts.push(`体力 +${effect.staminaDelta}`);
      return parts.join(' · ');
    }
    case 'grantHero': return `招揽名将一位 · 无法招揽时折银 ${effect.fallbackCash} 两`;
  }
  throw new Error(`即时样本漏登记效果 ${effect.kind}`);
}

function detailContents(entry) {
  const effects = entry.choices
    ? `<div class="read-only">${entry.choices.map(choice => `<p>${typeset(choice.text)}</p>`).join('')}</div>`
    : `<p class="immediate">即时结算 · <span class="effects">${esc(instantEffect(entry.effect))}</span></p>`;
  return `<section class="detail-card ${tierClass[entry.tier]}" aria-labelledby="detail-title">
    <header class="detail-head">${pill(entry.tier[0])}<h2 id="detail-title">${esc(entry.id)}</h2>
      <small>${esc([entry.tier, ...entry.tags].join(' · '))}</small>
      <button type="button" class="close" data-close aria-label="关闭详情">×</button>
    </header>
    <div class="detail-body">${painting(entry)}<div class="detail-text"><p class="story">${typeset(entry.text)}</p>${effects}</div></div>
  </section>`;
}

function decisionContents(entry, variant, settled = null) {
  if (settled !== null) {
    return `<div class="test-result" role="status"><strong>已选 · ${esc(entry.id)}</strong>${typeset(entry.choices[settled].text)}</div>`;
  }
  const showsArt = variant === 'a' || entry.once;
  const choices = entry.choices.map((choice, index) => {
    const primary = index === 0 && entry.tier !== '霉运';
    return `<button class="option${primary ? ' primary' : ''}" type="button" data-choice="${index}">${typeset(choice.text)}</button>`;
  }).join('');
  return `<div class="scrim"></div><section class="scroll ${tierClass[entry.tier]} ${entry.once ? 'wide' : ''} ${showsArt ? 'illustrated' : 'plain'}" aria-labelledby="game-title">
    <header class="scroll-head">${pill('遇')}<h2 id="game-title">机遇 · ${esc(entry.id)}</h2>${entry.once ? ornaments : ''}</header>
    <div class="scroll-body">${showsArt ? painting(entry) : ''}
      <div class="scroll-copy"><p class="story">${typeset(entry.text)}</p><div class="options">${choices}</div></div>
    </div>
  </section>`;
}

function manualScene() {
  return `<div class="scene manual-scene" aria-label="首页打开的手册机遇笺">${manualContents()}</div>`;
}

function scrollScene(entry, variant, settled = null) {
  return `<div class="scene" aria-label="棋盘上的机遇抉择">${decisionContents(entry, variant, settled)}</div>`;
}
</script>
<script id="interaction">
const catalog = JSON.parse(document.getElementById('catalog-data').textContent);
const ornaments = document.getElementById('wheat-template').innerHTML;
const scenarios = catalog.filter(entry => entry.choices?.length > 1);
const preview = document.getElementById('preview');
const surfaces = document.getElementById('surfaces');
const scenarioNav = document.getElementById('scenarios');
const guidance = document.getElementById('guidance');
const detail = document.getElementById('detail');
const switches = document.querySelector('.switcher');
const params = new URLSearchParams(location.hash ? location.hash.slice(1) : location.search);
let surface = params.get('surface') === 'scroll' ? 'scroll' : 'manual';
let variant = params.get('variant') === 'b' ? 'b' : 'a';
let current = scenarios.find(entry => entry.art === params.get('scenario')) ?? scenarios.find(entry => entry.art === 'refugees');
let settled = null;

function fitScene() {
  const scale = preview.parentElement.clientWidth / 844;
  if (scale) preview.style.transform = `scale(${scale})`;
}

function render() {
  const manual = surface === 'manual';
  for (const button of surfaces.querySelectorAll('button')) {
    button.setAttribute('aria-pressed', button.dataset.surface === surface);
  }
  for (const button of switches.querySelectorAll('button')) {
    button.setAttribute('aria-pressed', button.dataset.variant === variant);
  }
  scenarioNav.hidden = manual;
  scenarioNav.innerHTML = manual ? '' : scenarios.map(entry => `<button type="button" data-scenario="${entry.art}" aria-pressed="${entry === current}">${esc(entry.id)}</button>`).join('') + (settled === null ? '' : '<button type="button" data-reset>重看抉择</button>');
  preview.innerHTML = manual ? manualScene() : scrollScene(current, variant, settled);
  guidance.textContent = manual ? '点一张机遇笺，查看完整故事和效果。手册两案共用同一画心。' :
    settled !== null ? '这里展示选中的原文；点「重看抉择」回到卷轴。' : '点 A、B 比较当前条目，也可以点选项试读抉择回执。';
  fitScene();
  const state = new URLSearchParams({ variant, surface, scenario: current.art });
  const prefix = location.protocol === 'file:' ? '#' : '?';
  history.replaceState(null, '', prefix + state);
}

surfaces.addEventListener('click', (event) => {
  const next = event.target.closest('button[data-surface]');
  if (!next) return;
  surface = next.dataset.surface;
  settled = null;
  render();
});
switches.addEventListener('click', (event) => {
  const next = event.target.closest('button[data-variant]');
  if (!next) return;
  variant = next.dataset.variant;
  settled = null;
  render();
});
scenarioNav.addEventListener('click', (event) => {
  const next = event.target.closest('button');
  if (!next) return;
  if (next.dataset.scenario) current = scenarios.find(entry => entry.art === next.dataset.scenario);
  settled = null;
  render();
  scenarioNav.querySelector(`[data-scenario="${current.art}"]`).focus({ preventScroll: true });
});
preview.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.detail) {
    detail.innerHTML = detailContents(catalog.find(entry => entry.art === button.dataset.detail));
    detail.showModal();
    return;
  }
  settled = Number(button.dataset.choice);
  render();
  scenarioNav.querySelector('[data-reset]').focus({ preventScroll: true });
});
detail.addEventListener('click', (event) => {
  if (event.target === detail || event.target.closest('[data-close]')) detail.close();
});
new ResizeObserver(fitScene).observe(preview.parentElement);
render();
</script>

</body>
</html>
