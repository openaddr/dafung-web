    :root { color-scheme: dark; --bg: #16110c; --panel: #2b2317; --gold: #d9b95c; --paper: #f4ecd8; --dim: #c6b491; }

  const byId = (id) => document.getElementById(id);
  const optionButtons = document.querySelectorAll("[data-variant]");
  for (const piece of document.querySelectorAll("[data-box]")) {
    const [x, y, width, height] = piece.dataset.box.split(" ").map(Number);
    Object.assign(piece.style, {
      left: x / 844 * 100 + "%", top: y / 390 * 100 + "%",
      width: width / 844 * 100 + "%", height: height / 390 * 100 + "%",
    });
  }
  const visible = () => manual === null ? skillOpen || (myTurn && cards > 0) : manual;
  function render() {
    const shown = visible();
    const empty = shown && cards === 0 && !skillOpen;
    byId("back").hidden = !(empty && variant === "A");
    byId("emptyNote").hidden = !(empty && variant === "B");
    byId("card").hidden = !(shown && cards > 0);
    byId("dice").hidden = !(shown && (cards > 0 || (empty && variant === "A")));
    byId("skill").hidden = !(shown && skillOpen);
    byId("skill").style.left = cards > 0 ? "54%" : "40.52%";
    byId("count").hidden = cards === 0;
    byId("entry").setAttribute("aria-pressed", shown);
    byId("entry").setAttribute("aria-label", (shown ? "收起" : "打开") + "锦囊，" + cards + " 张");
    byId("entryArt").src = empty && variant === "C" ? buttonArt.empty : shown ? buttonArt.open : buttonArt.closed;
    byId("capsule").textContent = skillOpen ? "出牌阶段" : myTurn ? "我方回合" : "他人回合";
    byId("turn").textContent = myTurn ? "切到他人回合" : "切回我方回合";
    byId("draw").disabled = cards > 0;
    byId("spend").disabled = cards === 0;
    byId("skillToggle").setAttribute("aria-pressed", skillOpen);
    for (const option of optionButtons) option.setAttribute("aria-pressed", option.dataset.variant === variant);
    const content = cards > 0 ? "手中有 1 张锦囊" : "手中无锦囊";
    const boardState = empty ? description[variant] : shown ? "有牌或可用技能时展示原牌架。" : "手牌区已收起，右下仍可打开。";
    byId("state").textContent = [content + "。", boardState, city && "点到了" + city + "。"].filter(Boolean).join(" ");
  }
  for (const option of optionButtons) {
    option.addEventListener("click", () => {
      variant = option.dataset.variant;
      const url = new URL(location.href);
      url.searchParams.set("variant", variant);
      if (location.protocol === "file:") location.hash = variant;
      else history.replaceState(null, "", url);
      render();
    });
  }
  for (const tile of document.querySelectorAll(".city")) {
    tile.addEventListener("click", () => {
      city = tile.getAttribute("aria-label");
      for (const other of document.querySelectorAll(".city")) other.setAttribute("aria-pressed", other === tile);
      render();
    });
  }
  byId("entry").addEventListener("click", () => { manual = !visible(); render(); });
  byId("turn").addEventListener("click", () => { myTurn = !myTurn; skillOpen = false; manual = null; render(); });
  byId("draw").addEventListener("click", () => { cards = 1; render(); });
  byId("spend").addEventListener("click", () => { cards = 0; skillOpen = false; manual = null; render(); });
  byId("skillToggle").addEventListener("click", () => { skillOpen = !skillOpen; if (skillOpen) myTurn = true; manual = null; render(); });
  render();
</script>
