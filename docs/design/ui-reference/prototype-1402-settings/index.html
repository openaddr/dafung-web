<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对局设置 · 开关触区对照</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; padding: 14px 10px 20px; display: grid; align-content: center; gap: 10px;
    background:#17130e; color:#f4ecd8; font: 14px system-ui,sans-serif; }
  main { max-width: 844px; width: 100%; margin: auto; }
  p { margin: 0 0 8px; color: #c6b491; }
  .board { width: 100%; aspect-ratio: 844 / 390; position: relative; overflow:hidden; isolation: isolate;
    background: url("./board.png") center / 100% 100% no-repeat; }
  svg { position: absolute; inset: 0; width:100%; height:100%; pointer-events:none; }
  [hidden] { display:none !important; }
  .hit { position: absolute; padding: 0; margin: 0; background: transparent; border: 0; border-radius: 4px; touch-action: manipulation; cursor: pointer; }
  .hit:focus-visible { outline: 2px solid #d9b95c; outline-offset:-2px; }
  nav { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:8px; margin: 10px auto 0; }
  nav a, nav button { display:inline-grid; place-items:center; font:inherit; text-decoration:none; cursor:pointer;
    min-height:40px; padding:0 14px; background:#2b2317; color:inherit; border:1px solid #6d5738; border-radius:6px; }
  nav a[aria-current] { background:#d9b95c; border-color:#d9b95c; color:#241d13; }
  #demo[data-outlines="off"] .region { visibility: hidden; }
</style>
<main>
  <p>八席对局 · 可点 × 关闭，再从左上齿轮打开。试点「音效」「托管」文字或右侧开关。</p>
  <div class="board" id="demo" data-variant="a" data-outlines="on">
    <svg id="art" aria-hidden="true" viewBox="0 0 844 390"><g id="modal">
  <defs>
    <linearGradient id="ink" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0" stop-color="#3d3325"/><stop offset="1" stop-color="#241d13"/></linearGradient>
    <linearGradient id="seal" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0" stop-color="#ecd28a"/><stop offset="1" stop-color="#c8a13a"/></linearGradient>
  </defs>
  <rect width="844" height="390" fill="rgb(5,4,2)" fill-opacity=".55"/>
  <rect x="285" y="31" width="274" height="333" rx="12" fill="#110d08" fill-opacity=".55"/>
  <rect x="287.5" y="29.5" width="269" height="332" rx="10" fill="url(#ink)" stroke="#d9b95c" stroke-opacity=".45"/>
  <rect x="291.5" y="33.5" width="261" height="324" rx="7" fill="none" stroke="#d9b95c" stroke-opacity=".55"/>
  <rect x="304" y="46" width="20" height="20" rx="3" fill="url(#seal)" transform="rotate(-4 314 56)"/>
  <text x="314" y="60" fill="#241d13" font-family="WenQuanYi Zen Hei, sans-serif" font-size="13" text-anchor="middle">设</text>
  <text x="332" y="63" fill="#f4ecd8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="18" letter-spacing="2">设置</text>
  <circle cx="530" cy="56" r="13.5" fill="#3b3222" stroke="#d9b95c" stroke-opacity=".58"/>
  <path d="M525 51 l10 10 m0 -10 l-10 10" fill="none" stroke="#c6b491" stroke-width="1.3" stroke-linecap="round"/>
<rect class="region sound" x="305.5" y="79.5" width="233" height="39" rx="4" fill="#d9b95c" fill-opacity=".10" stroke="#d9b95c" stroke-opacity=".9" stroke-dasharray="4 3"/><g id="soundPaint" data-checked="true">
        <rect class="track" x="506" y="89.8" width="32" height="18.4" rx="9.2" fill="#d9b95c"/>
        <circle class="thumb" cx="529" cy="99" r="8" fill="#f4ecd8"/>
      </g><text x="307" y="103.5" fill="#f4ecd8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="13" >音效</text><path d="M 305 119 H 539" stroke="#f4ecd8" stroke-opacity=".12"/><rect class="region host" x="305.5" y="119.5" width="233" height="39" rx="4" fill="#d9b95c" fill-opacity=".10" stroke="#d9b95c" stroke-opacity=".9" stroke-dasharray="4 3"/><g id="hostPaint" data-checked="false">
        <rect class="track" x="506" y="129.8" width="32" height="18.4" rx="9.2" fill="#786d56"/>
        <circle class="thumb" cx="515" cy="139" r="8" fill="#f4ecd8"/>
      </g><text x="307" y="143.5" fill="#f4ecd8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="13" >托管</text><path d="M 305 159 H 539" stroke="#f4ecd8" stroke-opacity=".12"/><text x="307" y="181.5" fill="#f4ecd8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="13" >演出加速</text><text x="538" y="181" fill="#c6b491" font-family="WenQuanYi Zen Hei, sans-serif" font-size="11" text-anchor="end">标准</text><path d="M 305 195 H 539" stroke="#f4ecd8" stroke-opacity=".12"/><text x="307" y="219.5" fill="#f4ecd8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="13" >战报</text><path d="M 527 211 l 4 4 -4 4" fill="none" stroke="#d9b95c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 305 235 H 539" stroke="#f4ecd8" stroke-opacity=".12"/><text x="307" y="259.5" fill="#f4ecd8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="13" >对局诊断</text><path d="M 527 251 l 4 4 -4 4" fill="none" stroke="#d9b95c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 305 275 H 539" stroke="#f4ecd8" stroke-opacity=".12"/><text x="307" y="297.5" fill="#f4ecd8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="13" >版本</text><text x="538" y="297" fill="#c6b491" font-family="WenQuanYi Zen Hei, sans-serif" font-size="11" text-anchor="end">2026.11.63</text><path d="M 305 311 H 539" stroke="#f4ecd8" stroke-opacity=".12"/><text x="307" y="335.5" fill="#e2634d" font-family="WenQuanYi Zen Hei, sans-serif" font-size="13" >回到主页</text><path d="M 527 327 l 4 4 -4 4" fill="none" stroke="#e2634d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
    <button class="hit" id="open" type="button" aria-label="设置" aria-expanded="true" hidden></button>
    <div id="controls">
      <button class="hit" id="backdrop" type="button" tabindex="-1" aria-hidden="true"></button>
      <div class="hit" id="panelHit" aria-hidden="true"></div>
      <button class="hit" id="close" type="button" aria-label="关闭设置"></button>
      <button class="hit" id="sound" type="button" aria-label="音效" role="switch" aria-checked="true"></button>
      <button class="hit" id="host" type="button" aria-label="托管" role="switch" aria-checked="false"></button>
    </div>
  </div>
  <nav aria-label="原型方案">
    <a id="a" href="?variant=a">A 整行可点</a>
    <a id="b" href="?variant=b">B 只点右侧</a>
    <button id="outlines" type="button" aria-pressed="true">显示触区</button>
  </nav>
</main>
<script>
  const byId = (id) => document.getElementById(id);
  const variant = new URLSearchParams(location.search).get("variant") === "b" ? "b" : "a";
  const demo = byId("demo");
  demo.dataset.variant = variant;
  byId(variant).setAttribute("aria-current", "true");
  const box = (id, x, y, w, h) => {
    Object.assign(byId(id).style, {
      left: x / 844 * 100 + "%", top: y / 390 * 100 + "%",
      width: w / 844 * 100 + "%", height: h / 390 * 100 + "%"
    });
  };
  box("open", 2, 2, 44, 44);
  box("close", 508, 34, 44, 44);
  box("backdrop", 0, 0, 844, 390);
  box("panelHit", 287, 29, 270, 333);
  byId("panelHit").style.cursor = "auto";
  const x = variant === "a" ? 305 : 483;
  for (const region of document.querySelectorAll(".region")) {
    region.setAttribute("x", String(x + 0.5));
    region.setAttribute("width", String(538 - x));
  }
  box("sound", x, 79, 539 - x, 40);
  box("host", x, 119, 539 - x, 40);
  const showSettings = (open) => {
    byId("modal").style.display = open ? "" : "none";
    byId("controls").hidden = !open;
    byId("open").hidden = open;
    byId("open").setAttribute("aria-expanded", String(open));
  };
  byId("open").onclick = () => showSettings(true);
  byId("close").onclick = () => showSettings(false);
  byId("backdrop").onclick = () => showSettings(false);
  for (const id of ["sound", "host"]) {
    const button = byId(id);
    const paint = byId(id + "Paint");
    button.onclick = () => {
      const on = button.getAttribute("aria-checked") !== "true";
      button.setAttribute("aria-checked", String(on));
      paint.querySelector(".track").setAttribute("fill", on ? "#d9b95c" : "#786d56");
      paint.querySelector(".thumb").setAttribute("cx", on ? "529" : "515");
    };
  }
  const outlines = byId("outlines");
  outlines.onclick = () => {
    const on = demo.dataset.outlines === "off";
    demo.dataset.outlines = on ? "on" : "off";
    outlines.setAttribute("aria-pressed", String(on));
  };
</script>
</html>
