const landFirst = rollStart + shakeMs;
const landLast = landFirst + clackGapMs;
const verdict = landLast + verdictMs;
const fade = verdict + holdMs;
const end = fade + fadeOutMs;
const crest = verdict + blowoutWaveDelayMs + 125;
const frameTimes = { read: verdict - 120, crest, hold: fade - 36 };
const clamp = (n) => Math.max(0, Math.min(1, n));
const ease = (n) => 1 - (1 - clamp(n)) ** 3;
const { paper, gold, goldBright, dark } = data.colors;

function timber() {
  let seed = 1415;
  const rand = () => {
    seed = (seed * 48271) % 2147483647;
    return seed / 2147483647;
  };
  let art = "";
  for (let i = 0; i < 126; i++) {
    const x = Math.round(rand() * 150 - 75);
    const y = Math.round(rand() * 142 - 53);
    const r = (0.2 + rand() * 0.65).toFixed(2);
    const color = rand() > 0.52 ? "#fff8d9" : "#674117";
    art += `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" opacity="${(0.09 + rand() * 0.3).toFixed(2)}"/>`;
  }
  return art;
}

const defs = `
<radialGradient id="veil" gradientUnits="userSpaceOnUse" cx="422" cy="195" r="422" gradientTransform="translate(0 61) scale(1 .69)">
  <stop stop-color="#181209" stop-opacity=".76"/><stop offset="1" stop-color="#0a0703" stop-opacity=".84"/>
</radialGradient>
<radialGradient id="canvas-wash">
  <stop offset="0" stop-color="#bf904b" stop-opacity=".22"/><stop offset=".84" stop-color="#bf904b" stop-opacity="0"/>
</radialGradient>
<radialGradient id="gold-aurora">
  <stop offset=".3" stop-color="#edc666" stop-opacity="0"/><stop offset=".69" stop-color="#d5a74b" stop-opacity=".4"/><stop offset="1" stop-color="#99744a" stop-opacity="0"/>
</radialGradient>
<linearGradient id="bone" x2=".83" y2="1" gradientUnits="objectBoundingBox">
  <stop stop-color="#fff5d0"/><stop offset=".36" stop-color="#e9d29d"/><stop offset=".7" stop-color="#dfc48b"/><stop offset="1" stop-color="#ae8950"/>
</linearGradient>
<linearGradient id="bevel" x2=".76" y2="1" gradientUnits="objectBoundingBox">
  <stop stop-color="#c3a066"/><stop offset=".35" stop-color="#705126"/><stop offset=".77" stop-color="#9d7541"/><stop offset="1" stop-color="#4b351c"/>
</linearGradient>
<linearGradient id="seal-lacquer" x2=".8" y2="1" gradientUnits="objectBoundingBox">
  <stop stop-color="#bb5440"/><stop offset=".42" stop-color="#923d2e"/><stop offset="1" stop-color="#60281e"/>
</linearGradient>
<linearGradient id="seal-gold" x2=".8" y2="1" gradientUnits="objectBoundingBox">
  <stop stop-color="#e8c479"/><stop offset=".52" stop-color="#bd954d"/><stop offset="1" stop-color="#997137"/>
</linearGradient>
<linearGradient id="brush-stroke" x1="-148" y1="71" x2="115" y2="-130" gradientUnits="userSpaceOnUse">
  <stop stop-color="#60442a" stop-opacity=".05"/><stop offset=".28" stop-color="#593916"/><stop offset=".65" stop-color="#2e1d10"/><stop offset="1" stop-color="#ba8b46" stop-opacity=".27"/>
</linearGradient>
<linearGradient id="brush-gold" x1="-151" y1="81" x2="125" y2="-125" gradientUnits="userSpaceOnUse">
  <stop stop-color="#8a6030" stop-opacity="0"/><stop offset=".36" stop-color="#a36b35" stop-opacity=".75"/><stop offset=".7" stop-color="#e6bd75"/><stop offset="1" stop-color="#c29351" stop-opacity=".2"/>
</linearGradient>
<filter id="drop" x="-.35" y="-.3" width="1.7" height="1.8">
  <feGaussianBlur stdDeviation="12"/>
</filter>
<filter id="halo" x="-.5" y="-.5" width="2" height="2">
  <feGaussianBlur stdDeviation="7"/>
</filter>
<filter id="dim" color-interpolation-filters="sRGB">
  <feColorMatrix type="saturate" values=".3"/>
  <feComponentTransfer><feFuncR type="linear" slope=".7"/><feFuncG type="linear" slope=".7"/><feFuncB type="linear" slope=".7"/></feComponentTransfer>
</filter>
<clipPath id="bone-inner"><rect x="-70" y="-86" width="140" height="172" rx="5"/></clipPath>
<clipPath id="seal-outline"><rect x="-34" y="-34" width="68" height="68" rx="7"/></clipPath>
<radialGradient id="splat">
  <stop stop-color="#38291d" stop-opacity=".8"/><stop offset=".49" stop-color="#281e15" stop-opacity=".63"/><stop offset="1" stop-color="#291e13" stop-opacity="0"/>
</radialGradient>
<g id="bone-fibers">
  <g fill="none" stroke-linecap="round">
    <path d="M-82 -54q41 -5 61 10t59 14 45 8M-83 -49q33 -4 60 9t58 16 47 9M-82 -44q29 -3 46 5t37 11M41 -19q27 1 44 10M-82 57q42 15 71 4t48 -6 44 1M-82 64q45 14 73 2t43 -7 48 4M-83 69q21 7 43 5m42 -8q23 -10 79 0M-83 18q11 7 21 5m116 -5q18 -2 28 5" stroke="#764523" stroke-width=".7" opacity=".25"/>
    <path d="M-85 -47q41 -8 70 9t58 15 42 10M-78 63q32 9 66 .5t96 -1M-86 56q37 14 69 7t44 -9 55 -2" stroke="#fff0bf" opacity=".45" stroke-width="1"/>
    <path d="m-59 65 7 5 9 -2 5 3 6 -2m96 -103 -4 8 -9 2 -6 5m-112 68 6 5 6 -1 4 2" stroke="#68461e" opacity=".53" stroke-width=".7"/>
    <path d="m-65 -2 4 3.7 4 -1.3m114 50 -3 5 -5 .5m-114 20 19 -.5m95 -115 10 1" stroke="#fff9e8" opacity=".57" stroke-width=".8"/>

`;

function glyph(id, x, y, scale = 1, opacity = 1) {
  return `<use href="#${id}" xlink:href="#${id}" transform="translate(${x} ${y}) scale(${scale})" opacity="${opacity}"/>`;
}

function strokeBehindWinner(x, parentScale, progress, direction) {
  const strength = Math.sin(Math.PI * clamp(progress)) ** 0.72;
  const travel = 0.78 + 0.22 * ease(progress);
  return `<g transform="translate(${x} ${Y}) scale(${parentScale * direction} ${parentScale}) scale(${travel})" opacity="${strength.toFixed(3)}">
    <path d="M-162 86C-147 44 -123 8 -94 -23C-50 -72 12 -113 82 -127C105 -132 124 -132 133 -129C99 -121 89 -113 67 -106C16 -86 -24 -54 -54 -21C-90 20 -117 54 -148 82L-167 98Z" fill="#22140f" stroke="#7e5327" stroke-width="8" filter="url(#halo)" opacity=".74"/>
    <path d="M-166 91C-157 56 -130 13 -99 -23C-56 -72 9 -111 78 -126C100 -132 117 -131 132 -129C115 -126 101 -122 88 -115C81 -114 76 -111 65 -108C16 -88 -24 -56 -54 -21C-85 13 -113 55 -144 79C-150 83 -158 87 -168 99Z" fill="url(#brush-stroke)"/>
    <g fill="none" stroke="url(#brush-gold)" stroke-linecap="round">
      <path d="M-164 86Q-134 10 -84 -37T39 -117Q93 -137 132 -129" stroke-width="2.4"/>
      <path d="M-170 96Q-153 50 -122 16T-53 -56Q-1 -102 69 -123" stroke-width="1.3" opacity=".69"/>
      <path d="M-159 89Q-110 53 -67 -7T49 -106Q86 -120 118 -126" stroke-width="1.25" opacity=".69"/>
      <path d="M-165 86Q-147 59 -128 44m242 -173 18 -2" stroke-width=".55"/>
    </g>
  </g>`;
}

function renderSign(side, status, t, reduced, x, scale, variant) {
  const sideIndex = x === X[0] ? 0 : 1;
  const sinceLand = t - landFirst - sideIndex * clackGapMs;
  const landed = sinceLand >= 0;
  const shaking = !landed && t >= rollStart;
  const pend = t < rollStart;
  const { winner, loser, blowout } = status;
  const glyphIndex = landed ? side.roll - 1 : (Math.floor((t - rollStart) / 60) + side.seat * 2 + 2) % data.signFaces.length;
  const glide = !reduced && !landed && t >= curtainMs ? ease((t - curtainMs) / windupMs) : 0;
  const angle = glide * (sideIndex === 0 ? 1.5 : -1.5);
  const move = glide * (sideIndex === 0 ? 8 : -8);
  const pop = !reduced && landed && sinceLand < landMs ? 1 + 0.09 * Math.sin(Math.PI * sinceLand / landMs) : 1;
  const strokeTime = (t - verdict - blowoutWaveDelayMs) / blowoutWaveMs;
  const pulse = strokeTime > 0 && strokeTime < 1 ? Math.sin(Math.PI * strokeTime) ** 0.62 : 0;
  const ringExpansion = 1 + 0.55 * ease(strokeTime);
  const brush = winner && blowout && variant === "B" && !reduced && pulse > 0
    ? strokeBehindWinner(x, scale, strokeTime, sideIndex === 0 ? 1 : -1) : "";
  const wave = winner && blowout && !reduced && pulse > 0
    ? `<rect x="-89" y="-103" width="178" height="206" rx="15" fill="none" stroke="${goldBright}" stroke-width="1.9" opacity="${pulse * (variant === "B" ? .14 : .64)}" transform="scale(${ringExpansion})"/>` : "";
  const winGlow = winner ? `
    <ellipse cy="6" rx="137" ry="137" fill="url(#gold-aurora)" opacity=".65"/>
    <rect x="-88" y="-103" width="176" height="206" rx="15" fill="none" stroke="${gold}" stroke-width="9" filter="url(#halo)" opacity=".48"/>
    <rect x="-88" y="-103" width="176" height="206" rx="15" fill="none" stroke="${goldBright}" stroke-width="2.4" opacity=".91"/>
  ` : "";
  const frame = winner ? goldBright : "#b58c43";
  const relaxedPop = winner && blowout ? 1 + .15 * (reduced ? 1 : ease((t - verdict) / 400)) : 1;
  const count = landed ? glyph("face-" + glyphIndex, 0, 14, relaxedPop)
    : shaking && !reduced ? glyph("face-" + glyphIndex, 0, 14, .99, .35) : "";
  const swirl = shaking ? `<g transform="translate(-19 -2) ${reduced ? "" : `rotate(${(t - rollStart) * .42} 19 17)`}">
    <path d="M 22 17a3 3 0 0 1 -6 0a5 5 0 0 1 9 0a7 7 0 0 1 -12 0a9 9 0 0 1 15 0a11 11 0 0 1 -18 0" fill="none" stroke="${paper}" opacity=".29" stroke-width="4" stroke-linecap="round"/>
  </g>` : "";
  const splats = loser && blowout ? `<g opacity="${reduced ? .54 : .54 * ease((t - verdict) / 400)}">
    <ellipse cx="-60" cy="-22" rx="28" ry="25" fill="url(#splat)"/>
    <ellipse cx="60" cy="-19" rx="26" ry="26" fill="url(#splat)"/>
    <ellipse cx="-62" cy="70" rx="28" ry="24" fill="url(#splat)"/>
    <ellipse cx="64" cy="66" rx="24" ry="23" fill="url(#splat)"/>
  </g>` : "";
  const groupOpacity = loser ? .82 : landed ? 1 : pend ? .46 : .63;
  return `${brush}<g transform="translate(${x + move} ${Y}) scale(${scale}) rotate(${angle})">
    ${wave}${winGlow}
    <g transform="scale(${pop})" opacity="${groupOpacity}">
      <rect x="-74" y="-78" width="148" height="178" rx="9" opacity=".59" filter="url(#drop)"/>
      <g ${loser ? 'filter="url(#dim)"' : ""}>
        <rect x="-75" y="-91" width="150" height="182" rx="10" fill="url(#bevel)" stroke="${frame}" stroke-width="${winner ? 2.4 : 1.2}"/>
        <g clip-path="url(#bone-inner)">
          <rect x="-70" y="-86" width="140" height="172" fill="url(#bone)"/>
          <use href="#bone-fibers" xlink:href="#bone-fibers"/>
          ${splats}
          <path d="M-70 -86h140v34h-140z" fill="${side.color}"/>
          <path d="M-70 -85h140m-140 33h140" stroke="#fff0c7" stroke-opacity=".38" stroke-width="1"/>
          <path d="M-70 -50h140" stroke="#6a4823" stroke-opacity=".56" stroke-width="1"/>
        </g>
        <rect x="-67" y="-82" width="134" height="164" rx="4" fill="none" stroke="${winner ? '#fff1a9' : '#ac8048'}" stroke-width=".9" opacity=".82"/>
        <path d="m-64 -78 5 0m118 0 5 0m-128 156 5 0m118 0 5 0" stroke="#fff8cf" stroke-width="1.45" opacity=".52"/>
        ${glyph("head-" + side.seat, 0, -69)}
        ${count}
        ${swirl}
      </g>
    </g>
  </g>`;
}

function sealArt(t, tie, reduced) {
  const press = t - verdict;
  const scale = reduced || press < 0 || press > 120 ? 1 : 1 + 0.13 * Math.sin(Math.PI * press / 120);
  const tone = tie ? goldBright : "#e8cba6";
  const glyphId = tie ? "stamp-tie" : "stamp-duel";
  return `<g transform="translate(422 195) rotate(-8) scale(${scale})">
    <rect x="-34" y="-27" width="68" height="68" rx="8" opacity=".75" filter="url(#drop)"/>
    <rect x="-35" y="-35" width="70" height="70" rx="8" fill="url(#${tie ? "seal-gold" : "seal-lacquer"})" stroke="${tone}" stroke-width="1.55"/>
    <g clip-path="url(#seal-outline)">
      <path d="M-31 -31h11l6 1 7 -1h19l3 1h18v17l-1 4v15l1 5v11l-1 5 -4 3h-20l-5 -1h-12l-5 1h-12l-5 -2v-16l1 -5v-19l-1 -5Z" fill="none" stroke="${tone}" stroke-width="2.3" stroke-linejoin="round" opacity=".86"/>
      <path d="m-28 -27 5 1 3 -1 7 1m22 -1 8 0 5 1 4 -1M-27 26l6 0 3 -1 4 1m25 0 8 -1 6 0M-29 -10v6m58 9v6" fill="none" stroke="${tone}" stroke-opacity=".39" stroke-width=".7" stroke-linecap="round"/>
      ${glyph(glyphId, 0, 0)}
      <path d="m-24 -11 .9 0m1 -7.5 1.1 -.2m4.8 5.2 1.3 -.1m3 27.2 1 -.2m27.4 -22.2 .9 .5m4.9 8.7 1.2 -.2m-1.1 16.6 1.6 -.3m-8.1 -7.1 .6 0m-26 -8.1 1.1 -.2m8.3 -14.8 1 .1" fill="none" stroke="${tie ? '#b28e4d' : '#6d2a20'}" stroke-width=".8" opacity=".68"/>
    </g>
  </g>`;
}

function duelArt(t, key, variant, viewer, reduced) {
  const scene = data.scenes[key];
  if (t >= end || t < 0) return "";
  const visible = reduced ? 1 : ease(t / curtainMs) * (1 - clamp((t - fade) / fadeOutMs));
  const judged = t >= verdict;
  const tie = judged && scene.winnerSeat === null;
  const wash = !reduced && judged && scene.blowout ? (1 - clamp((t - verdict) / blowoutWashMs)) : 0;
  const viewerFighting = scene.sides.some((side) => side.seat === viewer);
  const weighted = judged && viewerFighting ? (reduced ? 1 : ease((t - verdict) / 150)) : 0;
  return `<g opacity="${visible}">
    <rect width="${W}" height="${H}" fill="url(#veil)"/>
    ${wash > 0 ? `<ellipse cx="420" cy="195" rx="402" ry="195" fill="url(#canvas-wash)" opacity="${wash}"/>` : ""}
    ${scene.sides.map((side, index) => {
      const win = judged && !tie && scene.winnerSeat === side.seat;
      const lose = judged && !tie && !win &&
        (reduced || scene.winnerSeat !== viewer || (t - verdict) >= 100);
      const scale = 1 + weighted * (side.seat === viewer ? .06 : -.04);
      return renderSign(side, { winner: win, loser: lose, blowout: scene.blowout }, t, reduced, X[index], scale, variant);
    }).join("")}
    ${sealArt(t, tie, reduced)}
  </g>`;
}


const params = new URLSearchParams(location.protocol === "file:" && location.hash ? location.hash.slice(1) : location.search);
let variant = params.get("variant") === "B" ? "B" : "A";
let scene = Object.hasOwn(data.scenes, params.get("scene")) ? params.get("scene") : "blowout";
let viewer = [0, 1, 2].includes(Number(params.get("viewer"))) ? Number(params.get("viewer")) : 0;
let frame = Object.hasOwn(frameTimes, params.get("frame")) ? params.get("frame") : "crest";
const reducedControl = document.getElementById("reduced");
reducedControl.checked = params.has("motion") ? params.get("motion") === "reduced"
  : matchMedia("(prefers-reduced-motion: reduce)").matches;
const sceneControl = document.getElementById("scene");
const viewerControl = document.getElementById("viewer");
const art = document.getElementById("art");
const hud = document.getElementById("hud");
const board = document.getElementById("board");
document.getElementById("art-defs").innerHTML = defs;
const screen = document.getElementById("screen");
let playback;

function renderHud() {
  hud.innerHTML = viewer === 0 ? "" : `
    <rect x="298" y="12" width="137" height="19" rx="3" fill="#2b2317"/>
    ${glyph("hud-other-turn", 367, 21)}
    <rect x="809" y="31" width="23" height="12" rx="3" fill="#302719"/>
    ${glyph("hud-holdings", 822, 38)}
    <rect x="809" y="${viewer === 1 ? 71 : 110}" width="23" height="11" rx="3" fill="#302719"/>
    ${glyph("hud-you", 825, viewer === 1 ? 78 : 117)}`;
}

function shakeAt(t) {
  const progress = (t - verdict) / data.deskBlowoutMs;
  if (reducedControl.checked || !data.scenes[scene].blowout || progress < 0 || progress >= 1) return [0, 0];
  const points = [[0, 0], [-6, 3], [5, -5], [-5, -3], [4, 4], [0, 0]];
  const position = progress * (points.length - 1);
  const index = Math.floor(position);
  const fraction = (1 - Math.cos(Math.PI * (position - index))) / 2;
  return points[index].map((value, coord) => value * (1 - fraction) + points[index + 1][coord] * fraction);
}

function show(t) {
  art.innerHTML = duelArt(t, scene, variant, viewer, reducedControl.checked);
  const [x, y] = shakeAt(t);
  board.style.transform = `translate(${x}px, ${y}px)`;
}

function describe(playing = false) {
  const sceneData = data.scenes[scene];
  const scores = sceneData.sides.map((side) => side.guohao + side.glyph).join("、");
  const view = viewer === 2 ? "吴旁观" : (viewer === 0 ? "魏" : "蜀") + "参与";
  const frameLabel = {read: "双签已落", crest: sceneData.blowout ? "高潮帧" : "判词帧", hold: "判词停留"};
  const stage = playing ? "按 1× 播放" : frameLabel[frame];
  const motion = reducedControl.checked ? " · 减少动态效果" : "";
  document.getElementById("caption").textContent = `${sceneData.label} · ${view} · ${stage}${motion}`;
  document.getElementById("frame-title").textContent =
    playing ? `关中图，${stage}` : frame === "read" ? `关中图，双签已落，${scores}，${view}` : `关中图，${sceneData.label}，${scores}，${view}`;
  document.getElementById("description").textContent = variant === "A"
    ? "A 加重骨签边纹与印泥触感，保留判词的现役层次。"
    : "B 沿用 A 的骨签与印泥。在大胜已有的二次波内，以签后一笔分担亮环的强度。";
}

function update() {
  cancelAnimationFrame(playback);
  sceneControl.value = scene;
  viewerControl.value = viewer;
  for (const button of document.querySelectorAll("[data-variant]")) {
    button.setAttribute("aria-pressed", String(button.dataset.variant === variant));
  }
  for (const button of document.querySelectorAll("[data-frame]")) {
    button.setAttribute("aria-pressed", String(button.dataset.frame === frame));
    if (button.dataset.frame === "crest") {
      button.textContent = data.scenes[scene].blowout ? "高潮帧" : "判词帧";
    }
  }
  const query = new URLSearchParams({ variant, scene, viewer, frame, motion: reducedControl.checked ? "reduced" : "full" });
  history.replaceState({}, "", (location.protocol === "file:" ? "#" : "?") + query);
  renderHud();
  show(frameTimes[frame]);
  describe();
}

for (const button of document.querySelectorAll("[data-variant]")) {
  button.addEventListener("click", () => { variant = button.dataset.variant; update(); });
}
for (const button of document.querySelectorAll("[data-frame]")) {
  button.addEventListener("click", () => { frame = button.dataset.frame; update(); });
}
sceneControl.addEventListener("change", () => { scene = sceneControl.value; update(); });
viewerControl.addEventListener("change", () => { viewer = Number(viewerControl.value); update(); });
reducedControl.addEventListener("change", update);
document.getElementById("replay").addEventListener("click", () => {
  cancelAnimationFrame(playback);
  describe(true);
  const start = performance.now();
  function run(now) {
    const t = now - start;
    show(t);
    if (t < end) playback = requestAnimationFrame(run);
    else update();
  }
  playback = requestAnimationFrame(run);
});
const full = document.getElementById("full");
if (!screen.requestFullscreen) full.hidden = true;
full.addEventListener("click", () => screen.requestFullscreen());
document.getElementById("exit").addEventListener("click", () => document.exitFullscreen());
update();
</script>
</body>
