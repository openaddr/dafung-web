<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>破产自救 · 分页静态原型</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/src/app/styles/app.css" />
    <style>
      /* PROTOTYPE：#1401 静态容量样张，一页六项；仅展示，不接权威命令。 */
      * {
        box-sizing: border-box;
        font-weight: 400;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        color: var(--color-paper);
        font-family: var(--font-wenkai);
        font-synthesis: none;
      }
      .scene {
        position: relative;
        width: 844px;
        height: 390px;
        overflow: hidden;
        background: var(--color-bg);
      }
      .scene::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            color-mix(in srgb, var(--color-bg-deep) 64%, transparent),
            color-mix(in srgb, var(--color-bg-deep) 85%, transparent)
          ),
          url("/assets/textures/texture-gongxian-shanshui.webp") center / cover;
      }
      .hud {
        position: absolute;
        top: 8px;
        left: 16px;
        right: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--color-paper-dim);
        font-size: 12px;
        opacity: 0.6;
      }
      .capsule {
        padding: 3px 14px;
        border: 1px solid color-mix(in srgb, var(--color-gold) 30%, transparent);
        background: var(--color-bg-deep);
        border-radius: 18px;
      }
      .hud-country {
        font-family: var(--font-brush);
        font-size: 18px;
        color: var(--color-gold);
      }
      .dialog {
        position: absolute;
        inset: 44px 34px 16px;
        border: 1px solid color-mix(in srgb, var(--color-gold) 60%, transparent);
        border-radius: 6px;
        background: linear-gradient(var(--color-lacquer), var(--color-panel));
        box-shadow:
          0 10px 44px var(--color-bg-deep),
          inset 0 0 0 2px color-mix(in srgb, var(--color-gold) 9%, transparent);
        overflow: hidden;
      }
      .heading {
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 17px;
        border-bottom: 1px solid color-mix(in srgb, var(--color-gold) 30%, transparent);
      }
      .identity {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .seal {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        transform: rotate(-4deg);
        border-radius: 3px;
        background: var(--color-gold);
        color: var(--color-bg-deep);
        font-family: var(--font-brush);
        font-size: 21px;
      }
      h1 {
        margin: 0;
        font-family: var(--font-title);
        font-size: 22px;
        letter-spacing: 3px;
        color: var(--color-gold-bright);
      }
      .cash {
        display: flex;
        gap: 20px;
        font-size: 13px;
        color: var(--color-paper-dim);
        font-variant-numeric: tabular-nums;
      }
      .cash em {
        margin-left: 7px;
        color: var(--color-paper);
        font-size: 17px;
        font-style: normal;
      }
      .cash small {
        margin-left: 3px;
        font-size: 12px;
      }
      .asset-area {
        height: 202px;
        padding: 0 17px 8px;
      }
      .toolbar {
        height: 38px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .toolbar-title {
        font-size: 14px;
        color: var(--color-paper-dim);
      }
      .pager {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 38px;
        color: var(--color-paper-dim);
        font-size: 13px;
      }
      .pager-arrow {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        color: var(--color-gold);
      }
      .pager-arrow svg {
        width: 14px;
        height: 14px;
      }
      .pager .muted {
        opacity: 0.25;
      }
      .page-num {
        text-align: center;
        min-width: 42px;
        font-variant-numeric: tabular-nums;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 74px);
        gap: 8px;
      }
      .asset {
        position: relative;
        display: flex;
        gap: 9px;
        align-items: center;
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid color-mix(in srgb, var(--color-gold) 23%, transparent);
        border-radius: 4px;
        background: var(--color-bg-deep);
      }
      .asset.selected,
      .ready .asset.future-selected {
        border-color: var(--color-gold);
        background: linear-gradient(
          100deg,
          color-mix(in srgb, var(--color-gold) 14%, var(--color-bg-deep)),
          var(--color-panel)
        );
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-gold) 12%, transparent);
      }
      .asset-art {
        flex: 0 0 38px;
        width: 38px;
        height: 52px;
        object-fit: cover;
        border-radius: 2px;
        opacity: 0.92;
      }
      .icon-art {
        display: grid;
        place-items: center;
        color: var(--color-gold-deep);
        background: color-mix(in srgb, var(--color-panel-hi) 70%, var(--color-bg-deep));
      }
      .icon-art svg {
        width: 34px;
        height: 36px;
      }
      .asset-content {
        flex: 1;
        min-width: 0;
      }
      .name-row {
        display: flex;
        justify-content: space-between;
        gap: 4px;
        align-items: center;
        height: 22px;
      }
      .name {
        font-size: 16px;
        white-space: nowrap;
      }
      .book .name {
        font-size: 14px;
      }
      .owned {
        color: var(--color-paper-dim);
        font-size: 11px;
        white-space: nowrap;
        margin-right: 10px;
      }
      .lower {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 30px;
      }
      .book .lower {
        height: 36px;
      }
      .price {
        color: var(--color-money);
        font-size: 17px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .unit {
        font-size: 11px;
        margin-left: 3px;
      }
      .city-meta {
        color: var(--color-paper-dim);
        font-size: 11px;
        margin-right: 12px;
      }
      .counter {
        display: flex;
        align-items: center;
        border: 1px solid color-mix(in srgb, var(--color-gold) 36%, transparent);
        border-radius: 3px;
        background: var(--color-bg-deep);
        height: 36px;
      }
      .counter-op {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        color: var(--color-gold);
      }
      .counter-op svg {
        width: 13px;
        height: 13px;
      }
      .counter-value {
        min-width: 22px;
        text-align: center;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      .tick {
        position: absolute;
        top: 3px;
        right: 4px;
        width: 12px;
        height: 12px;
        color: var(--color-gold);
        opacity: 0;
      }
      .selected .tick,
      .ready .future-selected .tick {
        opacity: 1;
      }
      .ready .asset:not(.selected):not(.future-selected) {
        opacity: 0.48;
      }
      .ready .counter-plus {
        opacity: 0.3;
      }
      .footer {
        height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 0 17px;
        border-top: 1px solid color-mix(in srgb, var(--color-gold) 30%, transparent);
      }
      .totals {
        display: flex;
        gap: 26px;
        align-items: center;
      }
      .amount-label {
        display: block;
        color: var(--color-paper-dim);
        font-size: 12px;
        margin-bottom: 1px;
      }
      .amount {
        font-size: 25px;
        line-height: 28px;
        color: var(--color-gold-bright);
        font-variant-numeric: tabular-nums;
      }
      .amount .unit {
        font-size: 12px;
      }
      .gap .amount {
        color: var(--color-danger);
      }
      .ready .gap .amount {
        color: var(--color-money);
      }
      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .action {
        display: grid;
        place-items: center;
        min-height: 44px;
        border-radius: 4px;
        font-family: var(--font-brush);
        font-size: 19px;
        letter-spacing: 1px;
        padding: 0 15px;
      }
      .bankrupt {
        color: var(--color-danger);
        border: 1px solid color-mix(in srgb, var(--color-danger) 38%, transparent);
      }
      .settle {
        min-width: 164px;
        color: var(--color-paper-dim);
        background: var(--color-panel-hi);
        border: 1px solid color-mix(in srgb, var(--color-paper-dim) 28%, transparent);
        opacity: 0.45;
      }
      .ready .settle {
        opacity: 1;
        color: var(--color-lacquer-gold);
        background: var(--color-lacquer);
        border-color: var(--color-gold);
        box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--color-gold) 10%, transparent);
      }
      .when-ready {
        display: none;
      }
      .ready .when-ready {
        display: inline;
      }
      .ready .when-short {
        display: none;
      }
      .static-note {
        position: absolute;
        left: 19px;
        bottom: 5px;
        font-size: 9px;
        color: var(--color-paper-dim);
        opacity: 0.4;
        letter-spacing: 1px;
      }
      .svg-defs {
        position: absolute;
        width: 0;
        height: 0;
      }
    </style>
  </head>
  <body>
    <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="city" viewBox="0 0 40 40">
        <path
          d="M4 16h32M7 16v17h26V16M3 16l7-7h20l7 7M10 9V5m20 4V5M4 33h32M12 20v5m16-5v5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path d="M17 33V23h6v10" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M10 12h20" stroke="currentColor" stroke-width="2" />
      </symbol>
      <symbol id="book" viewBox="0 0 40 44">
        <path d="M8 7h23v31H8z" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M8 33h23M13 7v26M6 12h5M6 19h5M6 26h5M18 14h8M18 19h8M18 24h6"
          stroke="currentColor"
          stroke-width="1.5"
        />
      </symbol>
      <symbol id="check" viewBox="0 0 16 16">
        <path
          d="m3 8 3 3 7-7"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="left" viewBox="0 0 16 16">
        <path
          d="m10 3-5 5 5 5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="right" viewBox="0 0 16 16">
        <path
          d="m6 3 5 5-5 5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="minus" viewBox="0 0 16 16">
        <path d="M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="plus" viewBox="0 0 16 16">
        <path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
    </svg>
    <main
      class="scene"
      role="img"
      aria-label="破产自救静态原型：一页六项，重复珍宝用数量器，金额与清偿按钮固定"
    >
      <div class="hud">
        <span>群雄逐鹿</span
        ><span class="capsule"><span class="hud-country">魏</span> · 第十二轮</span
        ><span>蜀　吴　群</span>
      </div>
      <section class="dialog">
        <header class="heading">
          <div class="identity">
            <span class="seal">魏</span>
            <h1>变卖自救</h1>
          </div>
          <div class="cash">
            <span>现钱<em>500</em><small>两</small></span
            ><span>债务<em>2,100</em><small>两</small></span>
          </div>
        </header>
        <div class="asset-area">
          <div class="toolbar">
            <span class="toolbar-title">珍宝与城池</span>
            <div class="pager">
              <span class="pager-arrow muted"
                ><svg><use href="#left" /></svg></span
              ><span class="page-num">1 / 2</span
              ><span class="pager-arrow"
                ><svg><use href="#right" /></svg
              ></span>
            </div>
          </div>
          <div class="grid">
            <div class="asset selected book">
              <span class="asset-art icon-art"
                ><svg><use href="#book" /></svg
              ></span>
              <div class="asset-content">
                <div class="name-row">
                  <span class="name">技能书·洞察</span><span class="owned">共4册</span>
                </div>
                <div class="lower">
                  <span class="price">200<span class="unit">两/册</span></span
                  ><span class="counter"
                    ><span class="counter-op"
                      ><svg><use href="#minus" /></svg></span
                    ><span class="counter-value">2</span
                    ><span class="counter-op counter-plus"
                      ><svg><use href="#plus" /></svg></span
                  ></span>
                </div>
              </div>
              <svg class="tick"><use href="#check" /></svg>
            </div>
            <div class="asset future-selected">
              <img class="asset-art" src="/assets/treasures/treasure-qingnang.webp" alt="" />
              <div class="asset-content">
                <div class="name-row"><span class="name">青囊书残卷</span></div>
                <div class="lower">
                  <span class="price">600<span class="unit">两</span></span>
                </div>
              </div>
              <svg class="tick"><use href="#check" /></svg>
            </div>
            <div class="asset">
              <img class="asset-art" src="/assets/treasures/treasure-hu.webp" alt="" />
              <div class="asset-content">
                <div class="name-row"><span class="name">小斛</span></div>
                <div class="lower">
                  <span class="price">300<span class="unit">两</span></span>
                </div>
              </div>
            </div>
            <div class="asset selected">
              <span class="asset-art icon-art"
                ><svg><use href="#city" /></svg
              ></span>
              <div class="asset-content">
                <div class="name-row"><span class="name">颍川</span></div>
                <div class="lower">
                  <span class="price">900<span class="unit">两</span></span
                  ><span class="city-meta">县城 · Lv.0</span>
                </div>
              </div>
              <svg class="tick"><use href="#check" /></svg>
            </div>
            <div class="asset">
              <span class="asset-art icon-art"
                ><svg><use href="#city" /></svg
              ></span>
              <div class="asset-content">
                <div class="name-row"><span class="name">宛城</span></div>
                <div class="lower">
                  <span class="price">1,500<span class="unit">两</span></span
                  ><span class="city-meta">奇城 · Lv.0</span>
                </div>
              </div>
            </div>
            <div class="asset">
              <span class="asset-art icon-art"
                ><svg><use href="#city" /></svg
              ></span>
              <div class="asset-content">
                <div class="name-row"><span class="name">新野</span></div>
                <div class="lower">
                  <span class="price">900<span class="unit">两</span></span
                  ><span class="city-meta">县城 · Lv.0</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <footer class="footer">
          <div class="totals">
            <div>
              <span class="amount-label">已选</span
              ><span class="amount"
                ><span class="when-short">1,300</span><span class="when-ready">1,900</span
                ><span class="unit">两</span></span
              >
            </div>
            <div class="gap">
              <span class="amount-label"
                ><span class="when-short">还差</span><span class="when-ready">超出</span></span
              ><span class="amount">300<span class="unit">两</span></span>
            </div>
          </div>
          <div class="actions">
            <span class="action bankrupt">认破产</span><span class="action settle">出售并清偿</span>
          </div>
        </footer>
      </section>
      <span class="static-note">静态样张 · 示意库存 · 844 × 390</span>
    </main>
  </body>
</html>
